<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f2b48" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Circular background badge with subtle ring -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#e2e8f0" stroke-width="4" />

  <g transform="translate(48, 16) scale(2.6)">
    <!-- 1. Laureles superiores en verde oliva -->
    <g stroke="#6b7c3d" stroke-width="1.6" fill="#7a8c48" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 72 24 C 62 26 50 36 46 50" fill="none" />
      <ellipse cx="71" cy="22" rx="4.5" ry="2.2" transform="rotate(-30 71 22)" />
      <ellipse cx="61" cy="27" rx="4.5" ry="2.2" transform="rotate(-45 61 27)" />
      <ellipse cx="53" cy="35" rx="4.5" ry="2.2" transform="rotate(-65 53 35)" />
      <ellipse cx="47" cy="46" rx="4.5" ry="2.2" transform="rotate(-80 47 46)" />

      <path d="M 88 24 C 98 26 110 36 114 50" fill="none" />
      <ellipse cx="89" cy="22" rx="4.5" ry="2.2" transform="rotate(30 89 22)" />
      <ellipse cx="99" cy="27" rx="4.5" ry="2.2" transform="rotate(45 99 27)" />
      <ellipse cx="107" cy="35" rx="4.5" ry="2.2" transform="rotate(65 107 35)" />
      <ellipse cx="113" cy="46" rx="4.5" ry="2.2" transform="rotate(80 113 46)" />
    </g>

    <!-- 2. Bandera Peruana (Izquierda: Rojo - Blanco - Rojo) -->
    <path d="M 44 48 C 30 62 28 88 38 106 C 41 98 44 92 48 86 C 42 74 41 60 44 48 Z" fill="#c8102e" />
    <path d="M 47 52 C 37 66 37 84 46 96 C 48 90 51 84 54 78 C 50 70 48 60 47 52 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
    <path d="M 50 56 C 43 68 45 80 52 88 C 54 84 57 80 60 76 C 56 70 53 62 50 56 Z" fill="#c8102e" />
    <circle cx="41" cy="76" r="3.2" fill="#eab308" stroke="#c8102e" stroke-width="0.8" />

    <!-- Bandera Francesa (Derecha: Azul - Blanco - Rojo) -->
    <path d="M 116 48 C 130 62 132 88 122 106 C 119 98 116 92 112 86 C 118 74 119 60 116 48 Z" fill="#002654" />
    <path d="M 113 52 C 123 66 123 84 114 96 C 112 90 109 84 106 78 C 110 70 112 60 113 52 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5" />
    <path d="M 110 56 C 117 68 115 80 108 88 C 106 84 103 80 100 76 C 104 70 107 62 110 56 Z" fill="#ed2939" />

    <!-- 3. Molar central -->
    <path d="M 58 48 C 66 38 74 44 80 47 C 86 44 94 38 102 48 C 108 55 106 70 106 82 C 106 94 98 108 92 118 C 90 108 86 98 84 94 C 82 98 78 108 76 118 C 70 106 62 94 62 82 C 62 70 54 56 58 48 Z" fill="#ffffff" stroke="#112948" stroke-width="2.8" stroke-linejoin="round" />
    <path d="M 64 52 C 72 44 76 48 80 50 C 84 48 88 44 96 52" fill="none" stroke="#1d3f6a" stroke-width="2" stroke-linecap="round" />
    <path d="M 62 76 C 62 90 68 108 74 122 C 77 121 78 114 77 106 C 73 96 68 86 67 76 Z" fill="#b8832a" />
    <path d="M 98 76 C 98 90 92 108 86 122 C 83 121 82 114 83 106 C 87 96 92 86 93 76 Z" fill="#112948" />

    <!-- 4. Vicuña y friso de Chan Chan -->
    <g transform="translate(62, 56)">
      <path d="M 12 6 C 13 4 14 2 15 2 C 16 2 17 4 17 7 C 17 10 16 13 16 16 C 18 17 21 17 22 20 C 23 23 22 26 21 28 L 21 34 L 19 34 L 19 28 L 15 28 L 14 34 L 12 34 L 13 25 C 11 23 11 20 12 17 L 14 14 C 14 11 13 8 12 6 Z" fill="#b8832a" />
      <path d="M 15 2 L 14 0 M 16 2 L 17 0" stroke="#b8832a" stroke-width="1.2" stroke-linecap="round" />
      <g stroke="#b8832a" stroke-width="1.5" fill="none" stroke-linecap="square">
        <path d="M 10 32 L 14 32 L 14 28 L 18 28 L 18 24 L 22 24" />
        <path d="M 11 36 L 23 36" />
      </g>
    </g>

    <!-- 5. Torre Eiffel -->
    <g transform="translate(85, 52)">
      <line x1="12" y1="2" x2="12" y2="8" stroke="#112948" stroke-width="1.4" stroke-linecap="round" />
      <circle cx="12" cy="8" r="1.2" fill="#112948" />
      <path d="M 11 8 L 10 24 L 14 24 L 13 8 Z" fill="#112948" />
      <rect x="8.5" y="24" width="7" height="1.8" fill="#112948" rx="0.5" />
      <path d="M 9.5 26 L 7 42 L 17 42 L 14.5 26 Z" fill="none" stroke="#112948" stroke-width="1.6" />
      <rect x="6" y="42" width="12" height="2" fill="#112948" rx="0.5" />
      <path d="M 6.5 44 L 4 60 L 7.5 60 L 9 52 C 9 49 15 49 15 52 L 16.5 60 L 20 60 L 17.5 44 Z" fill="#112948" />
      <path d="M 7.5 56 C 9 52 15 52 16.5 56" fill="none" stroke="#ffffff" stroke-width="1.2" />
    </g>
  </g>

  <!-- Typography at bottom of icon -->
  <text x="256" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="900" fill="#0f2b48" letter-spacing="3">PERUANO FRANCESA</text>
  <text x="256" y="445" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#475569" letter-spacing="4">CENTRO ODONTOLÓGICO</text>
  <text x="256" y="472" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="3">TRUJILLO - PERÚ</text>
</svg>
